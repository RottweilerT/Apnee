name: Sauvegarde de la base

# Chaque nuit, copie TOUTE la base Firestore de l'appli (projet apnee-rottweilert) dans sauvegarde/base.json.enc :
# fiches, séances et « Mes séances » de chaque inscrit, et les tickets.
# Le dépôt est public : la copie est chiffrée (AES-256) avec le secret du dépôt SAUVEGARDE_CLE,
# personne ne peut la lire sans cette clé. Un nouveau fichier n'est enregistré que si la base a changé ;
# l'historique Git garde toutes les versions. Pour remettre une version : Action « Restaurer la base ».
# Lecture avec le compte de service Firebase (secret FIREBASE_COMPTE_SERVICE), car chaque inscrit
# ne peut lire que ses propres séances. Programme : outils/firestore_sauvegarde.py
on:
  schedule:
    - cron: "41 2 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency: sauvegarde

jobs:
  sauvegarde:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Vérifier les secrets
        env:
          CLE: ${{ secrets.SAUVEGARDE_CLE }}
          COMPTE: ${{ secrets.FIREBASE_COMPTE_SERVICE }}
        run: |
          if [ -z "$CLE" ]; then echo "::error::Le secret SAUVEGARDE_CLE manque dans les réglages du dépôt"; exit 1; fi
          if [ ${#CLE} -lt 20 ]; then echo "::error::Le secret SAUVEGARDE_CLE est trop court (20 caractères minimum)"; exit 1; fi
          if [ -z "$COMPTE" ]; then echo "::error::Le secret FIREBASE_COMPTE_SERVICE manque dans les réglages du dépôt"; exit 1; fi
      - name: Lire toute la base
        env:
          FIREBASE_COMPTE_SERVICE: ${{ secrets.FIREBASE_COMPTE_SERVICE }}
        run: python3 outils/firestore_sauvegarde.py lire /tmp/base.json
      - name: Chiffrer et enregistrer
        env:
          CLE: ${{ secrets.SAUVEGARDE_CLE }}
        run: |
          mkdir -p sauvegarde
          new=$(openssl dgst -sha256 -hmac "$CLE" /tmp/base.json | awk '{print $NF}')
          old=$(cat sauvegarde/empreinte.txt 2>/dev/null || true)
          if [ "$new" = "$old" ]; then echo "::notice::Base inchangée depuis la dernière sauvegarde"; rm -f /tmp/base.json; exit 0; fi
          openssl enc -aes-256-cbc -pbkdf2 -iter 200000 -salt -in /tmp/base.json -out sauvegarde/base.json.enc -pass env:CLE
          # Contrôle immédiat : la copie se déchiffre bien avec la clé
          openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 -in sauvegarde/base.json.enc -pass env:CLE | cmp -s - /tmp/base.json \
            || { echo "::error::La copie chiffrée ne se relit pas correctement : rien n'est enregistré"; exit 1; }
          echo "$new" > sauvegarde/empreinte.txt
          rm -f /tmp/base.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sauvegarde/
          git commit -m "Sauvegarde chiffrée de la base"
          for i in 1 2 3; do git pull --rebase -q && git push && break; sleep 5; done
